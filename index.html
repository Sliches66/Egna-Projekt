<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gissa talet</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Gissa talet Kakan tänker på</h1>
    <p>Jag tänker på ett tal mellan ett och 20 sniff sniff</p>
    <div class="game-container">
      <input type="number" id="guessInput" min="1" max="20" />
      <button id="guessButton">Gissa</button>
      <button id="restartButton">Spela igen</button>
    </div>
    <img src="img/lilla-kakan.jpg" alt="kakan" class="bottom-image" />

    <p id="message"></p>
  </body>
</html>
